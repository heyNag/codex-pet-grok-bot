name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pet:
    name: Build and validate pet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build deterministic shipping atlases
        run: npm run build:pets

      - name: Run tests
        run: npm test

      - name: Validate Codex pet contract
        run: npm run validate

      - name: Verify theme parity
        run: npm run qa:themes

      - name: Verify runtime continuity and previews
        run: npm run qa:runtime

      - name: Recheck official hatch QA seal portably
        run: npm run qa:official

      - name: Verify sealed visual QA evidence
        run: npm run qa:evidence

      - name: Verify committed generated artifacts are current
        run: >-
          git diff --exit-code --
          pet/
          qa/validation-dark.json
          qa/validation-light.json
          qa/theme-parity.json
          qa/runtime-continuity-dark.json
          qa/runtime-continuity-light.json
          qa/runtime-continuity.json
          qa/runtime-previews-dark/
          qa/runtime-previews-light/

      - name: Upload validated pet bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-pet-grok-bot
          path: |
            pet/grok-bot-dark/
            pet/grok-bot-light/
          if-no-files-found: error
